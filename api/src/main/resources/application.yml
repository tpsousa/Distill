spring:
  application:
    name: distill-api
  profiles:
    active: local

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: local

aws:
  region: us-east-1
  endpoint: http://localhost:4566
  access-key-id: test
  secret-access-key: test
  s3-path-style-access: true

distill:
  storage:
    bucket: distill-documents
  queue:
    name: distill-documents
  table:
    name: distill-documents
  documents:
    upload-url-expiration: 5m
    max-filename-length: 255
    allowed-content-types:
      - text/plain
      - application/pdf
    default-page-size: 20
    max-page-size: 100

---
spring:
  config:
    activate:
      on-profile: aws

aws:
  region: us-east-1
  endpoint: ""
  access-key-id: ""
  secret-access-key: ""
  s3-path-style-access: false

distill:
  storage:
    bucket: distill-documents
  queue:
    name: distill-documents
  table:
    name: distill-documents
  documents:
    upload-url-expiration: 5m
    max-filename-length: 255
    allowed-content-types:
      - text/plain
      - application/pdf
    default-page-size: 20
    max-page-size: 100
