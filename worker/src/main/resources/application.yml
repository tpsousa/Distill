spring:
  application:
    name: distill-worker
  main:
    web-application-type: none
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local

aws:
  region: us-east-1
  endpoint: http://localhost:4566

distill:
  storage:
    bucket: distill-documents
  queue:
    name: distill-documents
  table:
    name: distill-documents
  llm:
    provider: ollama
    model: llama3.2

---
spring:
  config:
    activate:
      on-profile: aws

aws:
  region: us-east-1
  endpoint: ""

distill:
  storage:
    bucket: distill-documents
  queue:
    name: distill-documents
  table:
    name: distill-documents
  llm:
    provider: bedrock
    model: anthropic.claude-3-haiku-20240307-v1:0
